<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none">
  <defs>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#00D4F5"/>
      <stop offset="42%"  stop-color="#4B7FEE"/>
      <stop offset="100%" stop-color="#8B2FCC"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#88EEFF" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#AABBFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#CC88FF" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="psychGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C8E0F4"/>
      <stop offset="100%" stop-color="#C0AAEE"/>
    </linearGradient>
    <linearGradient id="metricGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#A07AE0"/>
      <stop offset="100%" stop-color="#7225B8"/>
    </linearGradient>
    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feComponentTransfer in="blur" result="colored">
        <feFuncR type="linear" slope="0.2"/>
        <feFuncG type="linear" slope="0.7"/>
        <feFuncB type="linear" slope="1.0"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ekgGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="innerLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003850" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#001830" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A0050" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#100028" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="260" rx="22" fill="#080D1A"/>
  <ellipse cx="185" cy="130" rx="130" ry="70" fill="#00CCEE" opacity="0.06"/>
  <ellipse cx="415" cy="130" rx="130" ry="70" fill="#9030CC" opacity="0.06"/>
  <path d="M300,133 C274,57 95,57 95,133 C95,209 274,209 300,133 C326,57 505,57 505,133 C505,209 326,209 300,133Z" stroke="#000B22" stroke-width="32" stroke-linecap="round" opacity="0.7"/>
  <path d="M300,130 C274,54 95,54 95,130 C95,206 274,206 300,130 C326,54 505,54 505,130 C505,206 326,206 300,130Z" stroke="url(#loopGrad)" stroke-width="28" stroke-linecap="round" filter="url(#outerGlow)" opacity="0.45"/>
  <path d="M300,130 C274,54 95,54 95,130 C95,206 274,206 300,130" stroke="url(#loopGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M300,130 C326,54 505,54 505,130 C505,206 326,206 300,130" stroke="url(#loopGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M300,130 C274,54 95,54 95,130 C95,206 274,206 300,130" stroke="url(#sheenGrad)" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#softGlow)" opacity="0.75"/>
  <path d="M300,130 C326,54 505,54 505,130 C505,206 326,206 300,130" stroke="url(#sheenGrad)" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#softGlow)" opacity="0.75"/>
  <ellipse cx="185" cy="130" rx="72" ry="46" fill="url(#innerLeft)"/>
  <ellipse cx="415" cy="130" rx="72" ry="46" fill="url(#innerRight)"/>
  <path d="M300,130 C274,54 95,54 95,130" stroke="rgba(150,230,255,0.18)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M300,130 C326,54 505,54 505,130" stroke="rgba(200,160,255,0.14)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M258,133 L270,133 L276,115 L283,153 L290,123 L297,133 L313,133" stroke="#00E0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#ekgGlow)"/>
  <text x="118" y="126" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="300" letter-spacing="-0.5" fill="url(#psychGrad)" opacity="0.82">Psych</text>
  <text x="295" y="126" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="url(#metricGrad)">Metric</text>
</svg>